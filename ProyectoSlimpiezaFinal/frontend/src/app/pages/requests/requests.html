<div class="max-w-7xl mx-auto px-8 md:px-16 py-16 min-h-[70vh]">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">Mis Reservas</h1>
  </div>
  
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
    <table class="w-full text-left text-sm text-gray-600 min-w-[800px]">
      <thead class="bg-gray-50 border-b border-gray-200 text-gray-900">
        <tr>
          <th class="px-6 py-4 font-semibold">Mto.</th>
          <th class="px-6 py-4 font-semibold">Cliente</th>
          <th class="px-6 py-4 font-semibold">Dirección</th>
          <th class="px-6 py-4 font-semibold">Servicio</th>
          <th class="px-6 py-4 font-semibold">Fecha</th>
          <th class="px-6 py-4 font-semibold">Estado</th>
          <th class="px-6 py-4 font-semibold text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let req of requests; let i = index" class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 text-gray-400 font-mono">{{ req.id }}</td>
          <td class="px-6 py-4 font-medium text-gray-900">{{ req.clientName }}</td>
          <td class="px-6 py-4">{{ req.address }}</td>
          <td class="px-6 py-4">
            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">{{ req.serviceType }}</span>
          </td>
          <td class="px-6 py-4">{{ req.serviceDate }}</td>
          <td class="px-6 py-4">
            <span
              [ngClass]="{
                'bg-yellow-50 text-yellow-700': req.status === 'PENDIENTE',
                'bg-blue-50 text-blue-700': req.status === 'CONFIRMADA',
                'bg-green-50 text-green-700': req.status === 'REALIZADA',
                'bg-red-50 text-red-700': req.status === 'CANCELADA'
              }"
              class="px-3 py-1 rounded-full text-xs font-bold">
              {{ req.status }}
            </span>
          </td>
          <td class="px-6 py-4 text-right flex justify-end gap-4">
            <button (click)="startEdit(req)" class="text-blue-600 hover:text-blue-800 font-semibold cursor-pointer">Editar</button>
            <button (click)="deleteRequest(req.id)" class="text-red-500 hover:text-red-700 font-semibold cursor-pointer">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="requests.length === 0">
          <td colspan="7" class="px-6 py-12 text-center text-gray-400 text-base">
            No hay reservas registradas en el sistema todavía.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Edit Form -->
<div *ngIf="editingId !== null" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4 transition-opacity">
  <div class="bg-white rounded-2xl max-w-lg w-full p-8 shadow-2xl">
    <h2 class="text-2xl font-extrabold mb-6 text-gray-900">Editar Reserva #{{ editingId }}</h2>
    
    <div class="flex flex-col gap-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre</label>
        <input type="text" [(ngModel)]="editData.clientName" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Dirección</label>
        <input type="text" [(ngModel)]="editData.address" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Servicio</label>
          <select [(ngModel)]="editData.serviceType" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm bg-white">
            <option value="HOGAR">HOGAR</option>
            <option value="OFICINA">OFICINA</option>
            <option value="PROFUNDA">PROFUNDA</option>
            <option value="POST_OBRA">POST_OBRA</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha</label>
          <input type="date" [(ngModel)]="editData.serviceDate" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Estado</label>
        <select [(ngModel)]="editData.status" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm bg-white">
          <option value="PENDIENTE">PENDIENTE</option>
          <option value="CONFIRMADA">CONFIRMADA</option>
          <option value="REALIZADA">REALIZADA</option>
          <option value="CANCELADA">CANCELADA</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Notas Adicionales</label>
        <textarea rows="4" [(ngModel)]="editData.additionalNotes" class="w-full border border-gray-200 focus:ring-2 focus:ring-black outline-none rounded-lg px-4 py-2 text-gray-800 shadow-sm resize-none"></textarea>
      </div>
    </div>
    
    <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-gray-100">
      <button (click)="cancelEdit()" class="px-6 py-2.5 text-gray-600 font-bold hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">Cancelar</button>
      <button (click)="saveEdit()"
              [disabled]="isSaving || isSaveSuccess"
              [ngClass]="{'bg-green-600 hover:bg-green-700': isSaveSuccess, 'bg-black hover:bg-gray-800': !isSaveSuccess}"
              class="px-6 py-2.5 text-white font-bold rounded-lg transition-all duration-300 shadow-md cursor-pointer disabled:cursor-not-allowed flex items-center gap-2">
        <span *ngIf="!isSaving && !isSaveSuccess">Guardar Cambios</span>
        <span *ngIf="isSaving">Guardando...</span>
        <span *ngIf="isSaveSuccess" class="flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          ¡Guardado!
        </span>
      </button>
    </div>
  </div>
</div>
